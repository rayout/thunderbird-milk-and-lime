<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lime Mail Cards</title>
  <style>
    :root { color-scheme: light dark; font: menu; }
    body { max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    label { display: flex; gap: .6rem; align-items: center; font-weight: 600; }
    input { accent-color: #709329; }
    p { line-height: 1.5; }
    input[type="text"] { min-width: 16rem; padding: .5rem; }
    button { padding: .4rem .8rem; }
    form { display: grid; gap: .8rem; }
    form label { flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; margin-block: 1rem; }
    td { padding: .4rem; border-bottom: 1px solid GrayText; overflow-wrap: anywhere; }
    td img { width: 40px; height: 40px; border-radius: 50%; }
    h2 { margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>Lime Mail Cards</h1>
  <label><input id="separateTags" type="checkbox" disabled><span data-i18n="separateTagsLabel"></span></label>
  <p data-i18n="separateTagsHelp"></p>
  <h2 data-i18n="avatarsTitle"></h2>
  <p data-i18n="avatarsHelp"></p>
  <label><input id="onlineAvatars" type="checkbox" disabled><span data-i18n="onlineAvatarsLabel"></span></label>
  <p data-i18n="onlineAvatarsHelp"></p>
  <button id="clearAvatarCache" type="button" disabled data-i18n="clearAvatarCache"></button>
  <h2 data-i18n="avatarRulesTitle"></h2>
  <form id="avatarForm">
    <label><span data-i18n="avatarAddress"></span><input id="avatarKey" type="text" required placeholder="person@example.com / example.com" maxlength="320" disabled></label>
    <label><span data-i18n="avatarFile"></span><input id="avatarFile" type="file" required accept="image/png,image/jpeg,image/webp,image/gif" disabled></label>
    <p data-i18n="avatarFileHelp"></p>
    <button id="saveAvatar" type="submit" disabled data-i18n="saveAvatar"></button>
  </form>
  <table><tbody id="avatarRules"></tbody></table>
  <p id="noAvatarRules" data-i18n="noAvatarRules"></p>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="avatars.js"></script>
  <script src="options.js"></script>
</body>
</html>
